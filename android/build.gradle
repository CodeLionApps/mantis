// Mantis native agent as an RN library (autolinked). The agent's sources and its ContentProvider are compiled in only
// when MANTIS_E2E=1 is set for the Gradle build; otherwise the library is just the empty MantisPackage (autolinking
// needs a ReactPackage) and the app contains no agent.
def mantisEnv = System.getenv("MANTIS_E2E")
if (mantisEnv != null && !(mantisEnv in ["", "0", "1"])) {
    throw new GradleException("MANTIS_E2E must be 1 (agent) or 0/unset (no agent), got '${mantisEnv}'")
}
def mantisE2E = mantisEnv == "1"

// An app bundle (.aab) is what goes to Play: refuse to build one with the agent in it, e.g. when MANTIS_E2E=1 leaked
// into a release job. ponytail: a release .apk uploaded by hand is not caught here; scripts/check-release.sh is.
if (mantisE2E) {
    gradle.taskGraph.whenReady { graph ->
        def bundle = graph.allTasks.find { it.name ==~ /package\w*Bundle/ }
        if (bundle) throw new GradleException("MANTIS_E2E=1 in an app bundle build (${bundle.path}): the Mantis agent must never ship")
    }
}

apply plugin: "com.android.library"
// AGP 9 has built-in Kotlin; older AGP or android.builtInKotlin=false needs the plugin
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
if (agpMajor <= 8 || providers.gradleProperty("android.builtInKotlin").orNull == "false") {
    apply plugin: "kotlin-android"
}

def ext = { name, fallback -> rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback }

android {
    namespace "com.codelion.mantis"
    compileSdkVersion ext("compileSdkVersion", 35)
    defaultConfig {
        minSdkVersion ext("minSdkVersion", 24)
    }
    sourceSets {
        main {
            if (mantisE2E) {
                java.srcDirs += "src/mantis/java"
                manifest.srcFile "src/mantis/AndroidManifest.xml"
            }
        }
    }
}

dependencies {
    implementation "com.facebook.react:react-native:+" // react-android, resolved by the RN Gradle plugin
}
